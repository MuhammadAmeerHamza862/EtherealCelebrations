  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffffff;

    }

    header {
      background-color: #2c3e50;

      padding: 20px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #34495e;
      padding: 10px;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      padding: 60px 20px;
      text-align: center;
    }

    .welcome {
  background-image: url('https://blog.papermart.com/wp-content/uploads/2016/05/Chairs.png');
  background-size: cover;
  background-position: center;
  color: rgb(14, 3, 3);
  padding: 150px 20px 30px 20px; /* Increased padding for more space */
  text-align: center;
  position: relative; /* Allows positioning of the motto below */
}

.welcome-content {
  font-size: 58px; 
  font-weight: bold;
  z-index: 1;
}

.motto {
  background-color: rgba(0, 0, 0, 0.5); 
  padding: 20px;
  margin-top: 20px; 
  font-size: 20px;
  font-style: italic;
  position: absolute;
  bottom: 20px; 
  left: 50%;
  transform: translateX(-50%); 
  width: 80%; 
  color: white; 
}

    .events {
      background-color: #f4f4f4;
    }

    .event-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .event-card {
      background-color: white;
      border: 3px solid #ddd;
      border-radius: 8px;
      width: 250px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    .event-card:hover {
      transform: translateY(-5px);
    }

    .event-card img {
      width: 100%;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }

    .event-card h3 {
      padding: 15px;
      color: #2c3e50;
    }

    .cta {
      background-color: #0a3450;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    .calculator, .contact {
  background-color: #dcdde0;
  border-radius: 10px;
  padding: 30px;
  margin: 30px auto;
  width: 90%;
  max-width: 600px;
}

.calculator .form-group {
  margin-bottom: 20px; 
}

.calculator .form-group label {
  display: block;  /* Makes sure the label is stacked on top of the input */
  margin-bottom: 10px; 
}

.calculator .form-group input,
.calculator .form-group select {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background-color: #fff;
  color: #333;
  font-size: 1rem;
  margin-bottom: 20px;
}

button.cta {
  width: 50%;
  padding: 12px 24px;
  background-color: #03272c;
  color: white;
  border-radius: 8px;
  font-size: 1.2rem;
}
    .contact {
  background-color: #dcdde0;
  padding: 40px;
  border-radius: 10px;
  width: 90%;
  max-width: 600px;
  margin: 30px auto;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  text-align: center;
}

.contact h2 {
  font-size: 32px;
  margin-bottom: 20px;
  color: rgb(14, 3, 3);
}

.contact .form-group {
  margin-bottom: 20px;
}

.contact .form-group input,
.contact .form-group textarea {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 5px;
  box-sizing: border-box;
}

.contact .cta {
  padding: 15px 30px;
  background-color: #03272c;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
}

.contact .cta:hover {
  background-color: #4e5557;
}

  <section id="book" class="fade-in">
    <h2>Book Your Event Now

        🎉</h2>
    <button class="cta" onclick="document.getElementById('contact').scrollIntoView({ behavior: 'smooth' })">
      Get Started
    </button>
  </section>

  <section class="calculator fade-in">
    <h2>Cost Estimator</h2>
    <div class="form-group">
    <label>Event Type</label>
    <select id="eventType">
      <option value="500">Wedding</option>
      <option value="300">Birthday</option>
      <option value="400">Graduation</option>
      <option value="400">Baby Shower</option>
      <option value="400">Anniversary</option>
      <option value="400">Meeting</option>
    </select>
    <br />
    <label>No. of Guests</label>
    <input type="number" id="guests" placeholder="Enter number" />
    <br />
    <label>Decor Package</label>
    <select id="package">
      <option value="1">Basic</option>
      <option value="1.5">Premium</option>
      <option value="2">Luxury</option>
    </select>
</div>

    <br /><br />
    <button class="cta" onclick="calculateCost()">Estimate Cost</button>
    <p id="costResult"></p>
  </section>

  <section id="contact" class="contact fade-in">
    <h2>Contact Us</h2>
    <form action="https://formspree.io/f/xyzweyda" method="POST">
      <div class="form-group">
        <input type="text" name="name" placeholder="Your Name" required />
      </div>
      <div class="form-group">
        <input type="email" name="_replyto" placeholder="Your Email" required />
      </div>
      <div class="form-group">
        <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
      </div>
      <button class="cta" type="submit">Send Message</button>
    </form>
  </section>

  <script>
    // Scroll animation
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    });

    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    function calculateCost() {
  // Get event type value (base price)
  const base = parseInt(document.getElementById('eventType').value);
  
  // Get number of guests (default to 0 if empty)
  const guests = parseInt(document.getElementById('guests').value) || 0;
  
  // Get the multiplier for the package
  const multiplier = parseFloat(document.getElementById('package').value);
  
  // If guests are 0, only use the base price and package multiplier
  const total = guests > 0 
    ? (base + guests * 20) * multiplier  // Guests added to base
    : base * multiplier;                 // Only the base price and package
  
  // Display the result
  document.getElementById('costResult').innerText = "Estimated Cost: $" + total.toFixed(2);
}

  </script>
